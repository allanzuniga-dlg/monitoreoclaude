<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance · Claude</title>
<meta name="robots" content="noindex">
<style>
  :root { --fondo: #f6f7f9; --texto: #1d2733; --suave: #6b7785; --amarillo: #ffd23f; --naranja: #f59e0b; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #12161c; --texto: #e7ecf2; --suave: #8b97a6; } }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #vivo { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--fondo); }
  #sin { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; text-align: center; }
  #sin h1 { margin: 0; font-size: clamp(26px, 6vw, 40px); font-weight: 700; letter-spacing: .5px; }
  #sin p { margin: 0; color: var(--suave); font-size: 15px; max-width: 420px; }
  #cargando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--suave); }
  svg { width: min(260px, 70vw); height: auto; overflow: visible; }
  .respira { animation: respira 3.2s ease-in-out infinite; transform-origin: 130px 190px; }
  @keyframes respira { 50% { transform: scale(1.035, .975); } }
  .z { font-weight: 800; fill: var(--suave); opacity: 0; animation: z 3.6s ease-in infinite; }
  .z2 { animation-delay: 1.2s; } .z3 { animation-delay: 2.4s; }
  @keyframes z { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; }
                 100% { opacity: 0; transform: translate(26px, -60px) scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { .respira, .z { animation: none; } .z { opacity: .8; } }
</style>
</head>
<body>
<div id="cargando">Conectando…</div>
<iframe id="vivo" title="Avance en vivo"></iframe>

<div id="sin" role="status" aria-live="polite">
  <svg viewBox="0 0 260 240" aria-label="Pollito durmiendo">
    <text class="z"    x="178" y="70"  font-size="26">Z</text>
    <text class="z z2" x="190" y="58"  font-size="20">z</text>
    <text class="z z3" x="200" y="48"  font-size="16">z</text>
    <ellipse cx="130" cy="222" rx="78" ry="9" fill="#000" opacity=".08"/>
    <g class="respira">
      <!-- cuerpo -->
      <ellipse cx="130" cy="160" rx="80" ry="64" fill="#ffd23f"/>
      <!-- ala -->
      <path d="M92 158 q-30 6 -26 32 q22 4 42 -14 z" fill="#f5c11c"/>
      <!-- cabeza -->
      <circle cx="150" cy="112" r="46" fill="#ffd23f"/>
      <!-- copete -->
      <path d="M146 68 q-6 -18 6 -22 q-2 12 8 16 q-6 -14 8 -16 q-4 14 -8 24 z" fill="#f5c11c"/>
      <!-- ojos cerrados -->
      <path d="M128 110 q8 7 16 0" stroke="#3b2f20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M160 110 q8 7 16 0" stroke="#3b2f20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- mejillas -->
      <ellipse cx="128" cy="126" rx="7" ry="4.5" fill="#ff9e7a" opacity=".7"/>
      <ellipse cx="180" cy="126" rx="7" ry="4.5" fill="#ff9e7a" opacity=".7"/>
      <!-- pico -->
      <path d="M146 122 l16 0 l-8 10 z" fill="#f59e0b"/>
      <!-- gorro de dormir -->
      <path d="M112 86 q30 -46 78 -14 q-34 -6 -54 22 z" fill="#5b7bd5"/>
      <circle cx="194" cy="74" r="8" fill="#fff"/>
      <!-- patas -->
      <path d="M110 220 l-6 8 m6 -8 l0 9 m0 -9 l6 8" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <path d="M150 220 l-6 8 m6 -8 l0 9 m0 -9 l6 8" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </svg>
  <h1>Sin Conexión</h1>
  <p id="detalle">La computadora de trabajo no está transmitiendo el avance en este momento. La página se reconecta sola.</p>
</div>

<script>
// Portada fija: muestra la página de avance EN VIVO (servida por el túnel de la computadora de trabajo) y,
// si no responde, un pollito durmiendo con «Sin Conexión». Aquí no hay tokens ni accesos: solo la dirección pública del túnel.
const vivo = document.getElementById('vivo'), sin = document.getElementById('sin'), cargando = document.getElementById('cargando');
let url = '', conectado = null;

async function leerTunel() {
  const fuentes = ['tunel.json?t=' + Date.now(),
    'https://raw.githubusercontent.com/allanzuniga-dlg/monitoreoclaude/main/tunel.json?t=' + Date.now()];
  const leidos = await Promise.all(fuentes.map(f => fetch(f, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)));
  const mejor = leidos.filter(x => x && x.url).sort((a, b) => (b.actualizado || 0) - (a.actualizado || 0))[0];
  return mejor ? mejor.url.replace(/\/+$/, '') : '';
}

async function responde(u) {
  if (!u) return false;
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 8000);
  try { const r = await fetch(u + '/estado?t=' + Date.now(), { cache: 'no-store', signal: c.signal }); return r.ok; }
  catch (e) { return false; } finally { clearTimeout(t); }
}

function mostrar(ok) {
  cargando.style.display = 'none';
  if (ok === conectado) return;
  conectado = ok;
  if (ok) { vivo.src = url + '/?v=' + Date.now(); vivo.style.display = 'block'; sin.style.display = 'none'; document.title = 'Avance · Claude'; }
  else { vivo.style.display = 'none'; sin.style.display = 'flex'; document.title = 'Sin Conexión · Avance'; }
}

async function revisar() {
  let ok = await responde(url);
  if (!ok) { const nuevo = await leerTunel(); if (nuevo && nuevo !== url) { url = nuevo; conectado = null; ok = await responde(url); } }
  mostrar(ok);
}

(async () => { url = await leerTunel(); await revisar(); setInterval(revisar, 15000); })();
</script>
</body>
</html>
